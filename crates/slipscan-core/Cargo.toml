[package]
name = "slipscan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SlipScan domain model, SQLite storage, migrations, and core services"

[dependencies]
async-trait = { workspace = true }
# Pairing blobs are base64url text so they survive a copy-paste through a
# chat window, a QR code or a terminal.
base64 = "0.22"
chacha20poly1305 = { workspace = true }
# Per-OS well-known directories for the movable data folder: the fixed
# app-config dir (pointer file) and the default app-data dir. Same crate the
# Tauri shell resolves its paths through, so all surfaces agree.
dirs = { workspace = true }
# Device identity: ed25519 keypair per device, public half IS the device id.
ed25519-dalek = { workspace = true }
keyring = { workspace = true }
# `keyname`: the 8-word + checksum-word encoding of a public key, so a human
# can compare two devices out of band. Hex fingerprints do not get compared;
# words do. Not invented here — same facility Kotva identities use.
kotva-core = { workspace = true }
rusqlite = { workspace = true }
# The oplog signs every op as a COSE_Sign1 and orders it with an HLC. Both are
# the shared engine's, reached through the mapping crate rather than
# re-derived: `slipscan-sync` decides which primitive a table maps to, and
# `dmtap-sync` (kotva-sync) is the algebra itself.
slipscan-sync = { workspace = true }
dmtap-sync = { package = "kotva-sync", version = "0.1.0" }
rust_decimal = { workspace = true }
serde = { workspace = true }
# raw_value: the FX client captures OpenRate's decimal `rate` token verbatim
# (RawValue) so it never round-trips through f64. Purely additive feature.
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Data-folder move tests need real directories on disk.
tempfile = "3"
# Executor for the async FX transport tests (mock transports only — the crate
# itself performs no I/O).
tokio = { workspace = true }

# Native OS keychain backends. keyring compiles to a mock store on platforms
# where no backend feature is enabled, so builds stay green everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[lints]
workspace = true
