[package]
name = "slipscan-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SlipScan's replicated state expressed in the shared DMTAP Sync algebra (substrate/SYNC.md capability 3)"

[dependencies]
# The one shared implementation of the substrate merge algebra, published to
# crates.io from the KOTVA substrate repo. SlipScan is a native Rust product,
# so this is a plain crate dependency: no WASM, no embedded runtime, none of
# the binary-size cost the Go and JS surfaces pay to reach the same compiled
# core.
#
# Consumer source keeps saying `dmtap_sync::` via cargo's dependency-rename, so
# nothing in this crate had to move when the engine did.
#
# A REGISTRY dep is what lets this crate live in the workspace: cargo resolves
# a crates.io dependency from the committed Cargo.lock without touching the
# network, whereas a git dep is fetched during resolution regardless of which
# features are active. That difference is the entire reason this crate used to
# be `exclude`d from the workspace.
dmtap-sync = { package = "kotva-sync", version = "0.1.0", optional = true }

rust_decimal.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# ON by default since the engine was published. It was default-off only while
# the dependency was a GIT dep, which cargo fetches during resolution
# regardless of features and which broke a bare offline build. A registry dep
# resolves from the committed Cargo.lock with no network, so keeping the
# mapping off by default would now only mean its tests never run — the
# vacuous-gate pattern this repo has been removing everywhere else.
default = ["sync-dmtap"]
# The DMTAP Sync mapping (substrate/SYNC.md capability ③): the table registry,
# `op_for_write`/`parse_row_value`, and the address helpers. `slipscan-core`'s
# oplog is built on it.
#
# The entire test suite is behind this feature too. Turning it off compiles an
# empty lib that would run zero tests and print `test result: ok`, so
# `feature_gate` in src/lib.rs fails that invocation on purpose and names what
# it did not check. Skip loudly, never silently: a false green here is
# indistinguishable from a verified one.
sync-dmtap = ["dep:dmtap-sync"]

[lints]
workspace = true
