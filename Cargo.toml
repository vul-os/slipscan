[workspace]
resolver = "2"
members = ["crates/*"]
# slipscan-sync used to be `exclude`d here. It carried an optional GIT dependency on the
# shared merge engine, and cargo resolves every optional dependency's source during
# workspace resolution regardless of which features are active — so a plain `cargo build`
# still shelled out to a git remote with the feature off. `default-members` does not
# prevent that; only `exclude` did.
#
# The engine is now published to crates.io, and a registry dependency resolves from the
# committed Cargo.lock without any network access. The exclusion is therefore no longer
# needed, and slipscan-sync is an ordinary workspace member whose mapping stays behind a
# default-off `sync-dmtap` feature.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vulos/slipscan"
rust-version = "1.85"

[workspace.dependencies]
slipscan-core = { path = "crates/slipscan-core" }
slipscan-extract = { path = "crates/slipscan-extract" }
slipscan-ingest = { path = "crates/slipscan-ingest" }
slipscan-packs = { path = "crates/slipscan-packs" }
slipscan-server = { path = "crates/slipscan-server" }
slipscan-sync = { path = "crates/slipscan-sync" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# `rand_core`: device identity generates its keypair on the device itself
# (SigningKey::generate) — there is no provisioned or escrowed key anywhere.
ed25519-dalek = { version = "2", features = ["rand_core"] }
keyring = { version = "3", default-features = false }
# Human-verifiable key names (9-word, checksummed) for device fingerprints.
# Already in the lock as a kotva-sync dependency, so this adds no new package.
kotva-core = "0.2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
uninlined_format_args = "allow"
