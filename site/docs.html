<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowStock docs</title>
<meta name="description" content="FlowStock documentation — overview, getting started, sync, architecture, configuration.">
<link rel="icon" href="./flowstock.svg">
<style>*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f7f8fb; --bg-soft:#eef1f7; --panel:#ffffff; --panel-2:#f2f4f9;
  --border:#e5e9f0; --border-2:#d5dbe6;
  --text:#0f1729; --muted:#4a5468; --faint:#7a8497;
  --radius:16px; --max:1120px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --accent:#2563eb; --accent-2:#1d4ed8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0e17; --bg-soft:#0d131f; --panel:#111725; --panel-2:#0d131f;
    --border:#1e2637; --border-2:#2a3346;
    --text:#eef2f8; --muted:#a3adc2; --faint:#69748c;
    --accent:#4f83f6; --accent-2:#6b97f8;
  }
}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:16px}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

/* Header */
.site-header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 82%, transparent);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:18px;letter-spacing:-.03em;font-family:'Space Grotesk',var(--sans)}
.brand .tile{width:28px;height:28px}
.brand .tile img{width:100%;height:100%;object-fit:contain}
.nav-spacer{flex:1}
.nav-links{display:flex;align-items:center;gap:22px}
.nav-links a{color:var(--muted);font-size:14.5px;font-weight:500;transition:color .15s}
.nav-links a:hover{color:var(--text)}
.vulos-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border-2);border-radius:999px;font-size:13px;color:var(--muted);transition:border-color .15s,color .15s}
.vulos-badge:hover{border-color:var(--accent);color:var(--text)}
@media(max-width:760px){.nav-links{display:none}}

/* Footer */
.site-footer{border-top:1px solid var(--border);margin-top:40px;padding:40px 0}
.foot{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.foot .left{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.foot .links{display:flex;gap:20px;flex-wrap:wrap}
.foot .links a{color:var(--muted);font-size:14px}
.foot .links a:hover{color:var(--text)}

/* Docs viewer */
.docs-shell{display:grid;grid-template-columns:248px 1fr;gap:36px;align-items:start;padding:34px 0 70px}
@media(max-width:860px){.docs-shell{grid-template-columns:1fr}}
.docs-nav{position:sticky;top:84px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:14px}
.docs-nav .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:6px 10px}
.docs-nav a{display:block;padding:8px 11px;border-radius:9px;color:var(--muted);font-size:14.5px;font-weight:500;transition:.15s}
.docs-nav a:hover{background:var(--panel-2);color:var(--text)}
.docs-nav a.active{background:color-mix(in srgb,var(--accent) 14%, transparent);color:var(--text)}
@media(max-width:860px){.docs-nav{position:static}}
.docs-main{min-width:0}
.markdown{font-size:16px}
.markdown>*:first-child{margin-top:0}
.markdown h1{font-size:34px;letter-spacing:-.03em;margin:.2em 0 .5em;border-bottom:1px solid var(--border);padding-bottom:.3em;font-family:'Space Grotesk',var(--sans)}
.markdown h2{font-size:25px;letter-spacing:-.02em;margin:1.6em 0 .6em;border-bottom:1px solid var(--border);padding-bottom:.25em;font-family:'Space Grotesk',var(--sans)}
.markdown h3{font-size:19px;margin:1.4em 0 .5em}
.markdown h4{font-size:16px;margin:1.3em 0 .4em;color:var(--text)}
.markdown p,.markdown li{color:var(--muted)}
.markdown a{color:var(--accent);text-decoration:none}
.markdown a:hover{text-decoration:underline}
.markdown code{font-family:var(--mono);font-size:.88em;background:var(--panel-2);padding:2px 6px;border-radius:6px}
.markdown pre{background:var(--panel-2);border:1px solid var(--border-2);border-radius:12px;padding:16px 18px;overflow:auto}
.markdown pre code{background:none;padding:0;font-size:13.5px;line-height:1.7;color:var(--text)}
.markdown blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid var(--accent);background:var(--panel-2);color:var(--muted);border-radius:0 8px 8px 0}
.markdown table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:14.5px;display:block;overflow:auto}
.markdown th,.markdown td{border:1px solid var(--border-2);padding:9px 12px;text-align:left}
.markdown th{background:var(--panel-2);font-weight:600}
.markdown img{border-radius:10px;margin:1em 0;border:1px solid var(--border)}
.markdown hr{border:none;border-top:1px solid var(--border);margin:2em 0}
.docs-title{font-size:13px;color:var(--faint);margin-bottom:6px}
.docs-error{color:#dc2626;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);padding:14px 16px;border-radius:10px}
</style>
<script src="./assets/vendor/marked.umd.js"></script>
</head>
<body>
<header class="site-header"><div class="wrap nav">
    <a class="brand" href="./index.html"><span class="tile"><img src="./flowstock.svg" alt="FlowStock mark"></span>FlowStock</a>
    <div class="nav-spacer"></div>
    <nav class="nav-links">
      <a href="./index.html#features">Features</a>
      <a href="./index.html#sync">Sync</a>
      <a href="./docs.html">Docs</a>
      <a href="https://github.com/vul-os/flowstock" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <a class="vulos-badge" href="https://vulos.org" target="_blank" rel="noopener" title="Part of Vulos">Part of Vulos</a>
  </div></header>
<div class="wrap docs-shell">
  <aside class="docs-nav">
    <div class="label">FlowStock docs</div>
        <a data-slug="overview" href="#overview">Overview</a>
        <a data-slug="getting-started" href="#getting-started">Getting started</a>
        <a data-slug="sync" href="#sync">How sync works</a>
        <a data-slug="architecture" href="#architecture">Architecture</a>
        <a data-slug="configuration" href="#configuration">Configuration</a>
  </aside>
  <main class="docs-main">
    <div class="docs-title" id="crumb"></div>
    <article class="markdown" id="content">Loading…</article>
  </main>
</div>
<footer class="site-footer"><div class="wrap foot">
    <div class="left"><span>Part of <a href="https://vulos.org" target="_blank" rel="noopener" style="color:var(--text)">Vulos</a> — open, self-hostable apps. Standalone by design.</span></div>
    <div class="links">
      <a href="./docs.html">Docs</a>
      <a href="https://github.com/vul-os/flowstock" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/vul-os/flowstock/blob/main/LICENSE-MIT" target="_blank" rel="noopener">License</a>
      <a href="https://vulos.org" target="_blank" rel="noopener">vulos.org</a>
    </div>
  </div></footer>
<script>
// The site is served from the repo root; docs render straight from the repo's own markdown.
const DOCS = [
  {"slug":"overview","title":"Overview","path":"./docs/OVERVIEW.md"},
  {"slug":"getting-started","title":"Getting started","path":"./docs/GETTING-STARTED.md"},
  {"slug":"sync","title":"How sync works","path":"./docs/SYNC.md"},
  {"slug":"architecture","title":"Architecture","path":"./docs/ARCHITECTURE.md"},
  {"slug":"configuration","title":"Configuration","path":"./docs/CONFIGURATION.md"}
];
const bySlug = Object.fromEntries(DOCS.map(d=>[d.slug,d]));
const byFile = Object.fromEntries(DOCS.map(d=>[d.path.split('/').pop().toLowerCase(),d]));
const content = document.getElementById('content');
const crumb = document.getElementById('crumb');

if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

function setActive(slug){
  document.querySelectorAll('.docs-nav a').forEach(a=>a.classList.toggle('active', a.dataset.slug===slug));
}

async function load(slug){
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.textContent = doc.title;
  content.innerHTML = 'Loading…';
  try {
    const res = await fetch(doc.path, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);
    // Cross-doc links (e.g. SYNC.md, ../ARCHITECTURE.md#section) become sidebar navigation.
    content.querySelectorAll('a[href]').forEach(a=>{
      const h=a.getAttribute('href')||'';
      if(/^(https?:|#|mailto:)/i.test(h)) return;
      const m=h.match(/([^\/]+\.md)(#.*)?$/i);
      const target = m && byFile[m[1].toLowerCase()];
      if(target) a.setAttribute('href','#'+target.slug);
    });
    content.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
    window.scrollTo({top:0});
  } catch(err){
    content.innerHTML = '<div class="docs-error">Could not load <code>'+doc.path.split('/').pop()+'</code> — '+err.message+'</div>';
  }
}

function current(){ return (location.hash||'').replace('#','') || DOCS[0].slug; }
window.addEventListener('hashchange', ()=>load(current()));
load(current());
</script>
</body>
</html>
