name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  desktop-rust:
    # apps/desktop/src-tauri declares its own [workspace], so `cargo test
    # --workspace` at the repo root never reaches it and its tests went
    # unrun. Separate job because the tauri crate needs webkit2gtk at build
    # time (same system deps release.yml installs) and the root `rust` job
    # must stay free of them.
    name: Rust (desktop crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target
      - name: Install Linux system dependencies (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # The main workspace has been gated on `clippy -D warnings` all along;
      # this crate was not, and only ran tests. Dead residue from a refactor —
      # three unused imports and a computed-then-discarded binding — sat in
      # `pack_install` with nothing to catch it. Same bar as the workspace now.
      - name: Format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  sync-dmtap:
    # crates/slipscan-sync rejoined the root workspace once its dmtap-sync
    # dependency became a registry dep (kotva-sync, published to crates.io) —
    # see the root Cargo.toml and crates/slipscan-sync/Cargo.toml comments —
    # so it no longer fetches a sibling repo over the network. This job stays
    # anyway, now for two narrower reasons: a fast, scoped check of just this
    # crate with the feature explicitly named, and the vacuous-run guard
    # below.
    #
    # `sync-dmtap` is default-on (see Cargo.toml's [features] comment), which
    # means the *bare* `cargo test` a developer is most likely to type runs
    # the real suite and looks green — so the only way left to exercise
    # `feature_gate` (src/lib.rs), the guard that fails loudly, by name, if
    # the mapping suite is ever skipped, is to explicitly pass
    # `--no-default-features`. That guard is the sort of thing a later
    # refactor silently defeats (e.g. by flipping the default back off
    # without updating this check), so CI asserts the `--no-default-features`
    # run still refuses to look green — checking the guard fires by name, not
    # merely that the command exited non-zero (any compile error would do
    # that).
    name: Rust (slipscan-sync, --no-default-features guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/slipscan-sync -> crates/slipscan-sync/target
      - name: Test (sync-dmtap)
        run: |
          cargo test --manifest-path crates/slipscan-sync/Cargo.toml \
            --features sync-dmtap
      - name: --no-default-features must fail loudly, not vacuously pass
        run: |
          set +e
          out="$(cargo test --manifest-path crates/slipscan-sync/Cargo.toml \
            --no-default-features 2>&1)"
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::a --no-default-features cargo test on slipscan-sync reported success; the vacuous-run guard is gone"
            exit 1
          fi
          echo "$out" | grep -q 'dmtap_mapping_suite_did_not_run' || {
            echo "::error::run failed, but not via the feature_gate guard — it broke for some other reason"
            exit 1
          }
          echo "$out" | grep -q 'features sync-dmtap' || {
            echo "::error::the guard no longer prints the command that runs the real suite"
            exit 1
          }

  frontend:
    name: Frontend (check, test, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # site/docs/*.md and site/screenshots/ are generated copies of docs/*.md,
      # the root-level chapters, and docs/screenshots/. Editing a source
      # without re-running the sync used to publish stale text and stale
      # captures silently, so the copies are gated here — this is the only job
      # with Node, and the checks are dependency-free (the root package.json
      # has none), which is why they run before `npm ci`. They read the whole
      # repo, so they override the job's apps/desktop working directory.
      - name: Docs published to site are in sync
        run: npm run docs:check
        working-directory: .
      - name: Screenshots mirrored to site and assets are in sync
        run: npm run screenshots:check
        working-directory: .
      # brand/logo.svg and the wordmarks it sits alongside were hand-copied
      # into assets/brand/, site/assets/brand/, apps/desktop/src/assets/ and
      # apps/desktop/public/ with no sync step — five tracked copies with
      # nothing keeping them byte-identical after the first commit.
      - name: Brand assets mirrored from brand/ are in sync
        run: npm run brand:check
        working-directory: .
      # docs/parity.json enumerates the HTTP, IPC and client.ts surfaces, and
      # API.md quotes its counts as fact. Nothing checked either against the
      # code, so both drifted the moment anything shipped — Phase 6.5 landed 21
      # IPC commands with no client wrapper and the counts sat three features
      # stale. Derived from source here instead of trusted.
      - name: API surfaces match docs/parity.json
        run: npm run parity:check
        working-directory: .
      # A raw NUL byte makes a source file binary to grep, which then skips it
      # silently — Household.svelte was invisible to every text-based audit of
      # this repo until svelte-check happened to read it properly.
      - name: No source file is accidentally binary
        run: npm run source:check
        working-directory: .
      # Phases 6.2/6.3a/6.3b shipped contacts, the catalogue and the stock
      # ledger complete at every layer and then wired almost none of it to a
      # surface — 0 of 9 stock operations are reachable — while purchasing and
      # sales wired all ~38 of theirs onto those unusable foundations. Every
      # layer was individually finished, so nothing caught it. A ratchet: the
      # count may shrink, never grow.
      - name: No new core capability is left unreachable
        run: npm run reachable:check
        working-directory: .
      # apps/desktop/src/lib/api/mock.ts is what screens are developed against
      # when the app runs outside Tauri. Six of its operations disagreed with
      # core — each internally consistent and separately tested, so nothing
      # caught it until someone read both. Counts only; the point is the
      # trigger when either side's guards move.
      - name: Desktop mock guards still line up with core
        run: npm run mock-guards:check
        working-directory: .
      # A test that asserts nothing passes on a broken build and is
      # indistinguishable from a real one in every summary line; a todo!()
      # behind a real signature is a feature that does not exist. Both are
      # this codebase's documented failure mode — complete-looking layers that
      # are collectively hollow.
      - name: Every test asserts something, and no stubs ship
        run: npm run tests:check
        working-directory: .
      # PARITY.md scores 24 capabilities Built/Partial/Not built by hand, and
      # it has gone stale for a whole development wave before — it once said
      # "no invoicing at all" on a tree that had invoicing. The judgement
      # itself cannot be automated, but each row's falsifiable residue can: a
      # Not-built row names the symbol(s) whose absence it depends on, and
      # fails if one now exists; a Built row names the CoreService method(s)
      # it depends on, and fails if reachable:check's own call-detection finds
      # none of core's three surfaces reaching it — this repo's own
      # worst-documented defect, complete in core and reachable from nowhere.
      # The summary counts and docs/parity-matrix.json are derived from the
      # rows, never hand-typed, for the same reason docs/parity.json is.
      - name: Parity matrix rows are not stale
        run: npm run parity-matrix:check
        working-directory: .
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      # Type-aware lint. Deliberately a short allow-list rather than the full
      # recommended set — see the header of eslint.config.mjs, which records
      # what was measured off and why. The rule that pays for this step is
      # no-floating-promises: an unawaited call whose callee does not catch
      # internally becomes a rejection nobody sees, which in a double-entry
      # app is a posting error with no symptom.
      - name: Lint
        run: npm run lint
      # The gate scripts in scripts/ enforce everything above, and until this
      # step existed nothing type-checked THEM: Node runs them via native type
      # stripping, which erases the annotations without verifying any of them.
      # Several interfaces in sync-docs.ts had drifted to shapes the code never
      # used, and KNOWN_STALE_ANCHORS was declared string[] while every reader
      # treated its entries as objects — a ratchet that would have silently
      # stopped working rather than failing.
      #
      # It uses the compiler apps/desktop already installs, so the root
      # package.json stays dependency-free and the checks above can keep
      # running before any npm ci. That is also why this runs here rather than
      # beside them.
      - name: Gate scripts type-check
        run: npm run types:check
        working-directory: .
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Test (playwright)
        run: npm run test:e2e
