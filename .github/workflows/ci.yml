name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # backend/internal/substrate/engine_conformance_test.go drives the frozen
      # SYNC conformance vectors through the engine using literals copied into
      # that file, and cross-checks those literals against the real
      # conformance/vectors/sync_vectors.json in the kotva substrate repo. The
      # cross-check is the only part that needs a checkout; the checkout step
      # below supplies it, and this flag turns every remaining "could not
      # compare" path into a failure so it can never silently skip here.
      #
      # This replaces FLOWSTOCK_REQUIRE_UPSTREAM_VENDOR_CHECK, which guarded a
      # vendored copy of the binding that no longer exists — the engine is a
      # published, go.sum-pinned module now.
      FLOWSTOCK_REQUIRE_SPEC_VECTOR_CHECK: "1"
      FLOWSTOCK_KOTVA_DIR: ${{ github.workspace }}/.upstream-kotva

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Read the engine's version out of go.mod rather than duplicating it here,
      # so the pin stays written down where the toolchain enforces it. The
      # substrate repo tags its Go submodule as bindings/go/<version>, and the
      # vectors checked out at that tag are the ones the engine in that version
      # was built and proved against.
      - name: Resolve the engine's pinned version
        id: pin
        run: |
          ver="$(go list -m -f '{{.Version}}' github.com/vul-os/kotva/bindings/go)"
          if [ -z "$ver" ]; then
            echo "::error::go.mod does not require github.com/vul-os/kotva/bindings/go"
            exit 1
          fi
          echo "ref=bindings/go/$ver" >> "$GITHUB_OUTPUT"
          echo "engine module version: $ver"

      # vul-os/kotva is public, so this needs no token. If it ever fails the job
      # fails — which is the point: no vector cross-check, no green tick.
      - name: Check out the substrate repo at the engine's tag
        uses: actions/checkout@v4
        with:
          repository: vul-os/kotva
          ref: ${{ steps.pin.outputs.ref }}
          path: .upstream-kotva

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run check

      # site/ is FlowStock's published product site (vulos-static collects it at
      # build time). Its docs pages must be byte-identical to docs/ — the
      # published SYNC page once described sync as bearer-secret authenticated
      # long after the code required mutual Ed25519.
      - name: Published docs match the repo docs
        run: npm run docs:check

      # R-SOV-1 (kotva substrate/SOVEREIGNTY.md §3.1): the DEFAULT build and
      # startup path must carry no hard dependency on a reachability broker.
      # The gate is lifted verbatim from the substrate into tools/gates/, and the
      # step runs its self-control in the same breath — a copied gate that has
      # gone inert reports a pass nobody earned. Exit 2 ("could not check") fails
      # this step exactly like exit 1; there is no skip path.
      - name: R-SOV-1 gate — no reachability broker in the default path
        run: make sovereignty-gate

      # The lifted copy must stay byte-identical to the substrate's LIVE one.
      # Unlike the frozen vectors, which are pinned to the engine's tag, a gate is
      # not versioned content — a stale copy is the whole failure mode
      # (substrate/SOVEREIGNTY.md §5.3: "a copied script drifts"), so this tracks
      # kotva's default branch and goes red when the substrate improves the gate.
      # The fix is always to re-copy, never to edit the copy: FlowStock's
      # configuration lives in scripts/sovereignty-gate.sh.
      #
      # It fails closed on a missing file rather than skipping. If it is red
      # because the substrate has not published the gate yet, that is a real
      # cross-repo state and a red tick is the honest report of it.
      - name: Check out the substrate's live gate
        uses: actions/checkout@v4
        with:
          repository: vul-os/kotva
          path: .upstream-kotva-main

      - name: The lifted gate matches the substrate's
        run: |
          set -euo pipefail
          mine=tools/gates/no-broker-dep.sh
          theirs=.upstream-kotva-main/tools/gates/no-broker-dep.sh
          if [ ! -f "$theirs" ]; then
            echo "::error::$theirs is missing — the substrate does not publish the gate at that path, so this check verified NOTHING. Fix the path or the cross-repo expectation; do not delete the check."
            exit 1
          fi
          if ! diff -u "$theirs" "$mine"; then
            echo "::error::$mine has drifted from the substrate's copy — re-copy it rather than editing it (FlowStock's configuration belongs in scripts/sovereignty-gate.sh)"
            exit 1
          fi
          echo "$mine is byte-identical to the substrate's copy"

      - name: Go tests
        run: npm run test:go

      # The shared DMTAP sync engine is an opt-in build, so the substrate
      # package has to be compiled and tested under its own tag or nothing
      # covers it.
      - name: Go tests (-tags dmtap)
        run: go test -tags dmtap ./backend/...

      # The sync engine, the HLC and the SSE hub are all concurrent, and the
      # race detector is clean — so run it, in both tag configurations. Without
      # this step "clean under -race" was a claim nothing in CI stood behind.
      - name: Go tests (-race)
        run: go test -race ./backend/...

      - name: Go tests (-race -tags dmtap)
        run: go test -race -tags dmtap ./backend/...

      # Builds the single binary with the frontend embedded — the same artifact
      # the end-to-end tests drive, so a build break fails here with a clear message.
      - name: Build (frontend + binary)
        run: npm run build:all

      # And the -tags dmtap build of the same thing, which is the only binary
      # e2e/substrate-sync.spec.js can run against: the default build exits at
      # startup rather than pretend it has an engine.
      - name: Build (frontend + binary, -tags dmtap)
        run: npm run build:dmtap

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # Both binaries were just built by the steps above.
          FLOWSTOCK_SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A checksum guard that has quietly stopped failing is indistinguishable,
  # from a green CI run, from one that works. Both release guards are therefore
  # exercised on every push — not "does the script parse", but "does it still
  # REFUSE, and does it still install nothing when it does".
  release-guards:
    name: Release verifier & installer — failure matrices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n scripts/verify.sh
          sh -n install.sh
          bash -n scripts/install-failure-matrix.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh install.sh scripts/install-failure-matrix.sh

      # 24 synthetic-origin cases; asserts the exit code AND that a diagnostic
      # was printed, because "aborted with no message" was the real bug class.
      - name: verify.sh failure matrix
        run: bash scripts/verify.sh --selftest

      # 14 cases against a synthetic release origin; asserts the exit code, a
      # diagnostic, and — the one that matters — that NOTHING was installed on
      # any case except the one where the published digest matched.
      - name: install.sh failure matrix
        run: bash scripts/install-failure-matrix.sh
