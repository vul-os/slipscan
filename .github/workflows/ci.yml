name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  desktop-rust:
    # apps/desktop/src-tauri declares its own [workspace], so `cargo test
    # --workspace` at the repo root never reaches it and its tests went
    # unrun. Separate job because the tauri crate needs webkit2gtk at build
    # time (same system deps release.yml installs) and the root `rust` job
    # must stay free of them.
    name: Rust (desktop crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target
      - name: Install Linux system dependencies (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # The main workspace has been gated on `clippy -D warnings` all along;
      # this crate was not, and only ran tests. Dead residue from a refactor —
      # three unused imports and a computed-then-discarded binding — sat in
      # `pack_install` with nothing to catch it. Same bar as the workspace now.
      - name: Format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  sync-dmtap:
    # crates/slipscan-sync is `exclude`d from the root workspace so that a bare
    # `git clone && cargo build` never fetches envoir (see the root
    # Cargo.toml comment) — which also meant its tests were never run.
    #
    # Its own job, not a step in `rust`, precisely to preserve that property in
    # CI as well as on a laptop: this is the ONLY job that fetches a sibling
    # repo over the network, and the offline-buildable jobs neither wait on it
    # nor share a checkout step with it. If envoir ever becomes unreachable,
    # this job goes red on its own and the rest of the pipeline is unaffected.
    #
    # It runs on every push/PR rather than on a schedule because the dependency
    # is a public repo pinned to a reviewed rev, so the fetch is deterministic;
    # if that stops being true, move this to `on: schedule` — the command is
    # the same either way.
    name: Rust (slipscan-sync, fetches envoir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/slipscan-sync -> crates/slipscan-sync/target
      - name: Test (sync-dmtap)
        run: |
          cargo test --manifest-path crates/slipscan-sync/Cargo.toml \
            --features sync-dmtap
      # The whole suite lives behind the feature, so the bare invocation a
      # developer is most likely to type verifies nothing. It used to print
      # `test result: ok` for zero tests; `feature_gate` in src/lib.rs now
      # fails it and names what did not run. That guard is the sort of thing a
      # later refactor deletes without noticing, so CI asserts the bare command
      # still refuses to look green — checking the guard by name, not merely
      # that the command exited non-zero (any compile error would do that).
      - name: Bare invocation must fail loudly, not vacuously pass
        run: |
          set +e
          out="$(cargo test --manifest-path crates/slipscan-sync/Cargo.toml 2>&1)"
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::a bare cargo test on slipscan-sync reported success; the vacuous-run guard is gone"
            exit 1
          fi
          echo "$out" | grep -q 'dmtap_mapping_suite_did_not_run' || {
            echo "::error::bare run failed, but not via the feature_gate guard — it broke for some other reason"
            exit 1
          }
          echo "$out" | grep -q 'features sync-dmtap' || {
            echo "::error::the guard no longer prints the command that runs the real suite"
            exit 1
          }

  frontend:
    name: Frontend (check, test, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # site/docs/*.md and site/screenshots/ are generated copies of docs/*.md,
      # the root-level chapters, and docs/screenshots/. Editing a source
      # without re-running the sync used to publish stale text and stale
      # captures silently, so the copies are gated here — this is the only job
      # with Node, and the checks are dependency-free (the root package.json
      # has none), which is why they run before `npm ci`. They read the whole
      # repo, so they override the job's apps/desktop working directory.
      - name: Docs published to site are in sync
        run: npm run docs:check
        working-directory: .
      - name: Screenshots mirrored to site and assets are in sync
        run: npm run screenshots:check
        working-directory: .
      # docs/parity.json enumerates the HTTP, IPC and client.ts surfaces, and
      # API.md quotes its counts as fact. Nothing checked either against the
      # code, so both drifted the moment anything shipped — Phase 6.5 landed 21
      # IPC commands with no client wrapper and the counts sat three features
      # stale. Derived from source here instead of trusted.
      - name: API surfaces match docs/parity.json
        run: npm run parity:check
        working-directory: .
      # A raw NUL byte makes a source file binary to grep, which then skips it
      # silently — Household.svelte was invisible to every text-based audit of
      # this repo until svelte-check happened to read it properly.
      - name: No source file is accidentally binary
        run: npm run source:check
        working-directory: .
      # Phases 6.2/6.3a/6.3b shipped contacts, the catalogue and the stock
      # ledger complete at every layer and then wired almost none of it to a
      # surface — 0 of 9 stock operations are reachable — while purchasing and
      # sales wired all ~38 of theirs onto those unusable foundations. Every
      # layer was individually finished, so nothing caught it. A ratchet: the
      # count may shrink, never grow.
      - name: No new core capability is left unreachable
        run: npm run reachable:check
        working-directory: .
      # apps/desktop/src/lib/api/mock.ts is what screens are developed against
      # when the app runs outside Tauri. Six of its operations disagreed with
      # core — each internally consistent and separately tested, so nothing
      # caught it until someone read both. Counts only; the point is the
      # trigger when either side's guards move.
      - name: Desktop mock guards still line up with core
        run: npm run mock-guards:check
        working-directory: .
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Test (playwright)
        run: npm run test:e2e
