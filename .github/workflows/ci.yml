name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # third_party/dmtapsync is a vendored copy of envoir's Go bindings, and
      # backend/internal/substrate/vendor_drift_test.go compares it against the
      # exact upstream commit VENDOR.md pins. That comparison needs an envoir
      # checkout; it used to have none here, so the check *skipped in CI* while
      # reporting a green job — a gate passing by doing nothing. The checkout
      # step below supplies the commit, and this flag turns every remaining
      # "could not compare" path into a failure so it can never silently skip
      # here again.
      FLOWSTOCK_REQUIRE_UPSTREAM_VENDOR_CHECK: "1"
      FLOWSTOCK_ENVOIR_DIR: ${{ github.workspace }}/.upstream-envoir

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Read the pin out of VENDOR.md rather than duplicating it here, so the
      # commit stays written down exactly once (the Go test reads the same row).
      - name: Read the pinned upstream commit
        id: pin
        run: |
          sha="$(grep -m1 '^| Commit' third_party/dmtapsync/VENDOR.md | grep -oE '[0-9a-f]{40}' | head -1)"
          if [ -z "$sha" ]; then
            echo "::error::third_party/dmtapsync/VENDOR.md has no 40-character commit in its 'Commit' row"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pinned upstream commit: $sha"

      # vul-os/envoir is public, so this needs no token. If it ever fails the
      # job fails — which is the point: no provenance comparison, no green tick.
      - name: Check out envoir at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: vul-os/envoir
          ref: ${{ steps.pin.outputs.sha }}
          path: .upstream-envoir

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run check

      # site/ is FlowStock's published product site (vulos-static collects it at
      # build time). Its docs pages must be byte-identical to docs/ — the
      # published SYNC page once described sync as bearer-secret authenticated
      # long after the code required mutual Ed25519.
      - name: Published docs match the repo docs
        run: npm run docs:check

      - name: Go tests
        run: npm run test:go

      # The shared DMTAP sync engine is an opt-in build, so the substrate
      # package has to be compiled and tested under its own tag or nothing
      # covers it.
      - name: Go tests (-tags dmtap)
        run: go test -tags dmtap ./backend/...

      # The sync engine, the HLC and the SSE hub are all concurrent, and the
      # race detector is clean — so run it, in both tag configurations. Without
      # this step "clean under -race" was a claim nothing in CI stood behind.
      - name: Go tests (-race)
        run: go test -race ./backend/...

      - name: Go tests (-race -tags dmtap)
        run: go test -race -tags dmtap ./backend/...

      # Builds the single binary with the frontend embedded — the same artifact
      # the end-to-end tests drive, so a build break fails here with a clear message.
      - name: Build (frontend + binary)
        run: npm run build:all

      # And the -tags dmtap build of the same thing, which is the only binary
      # e2e/substrate-sync.spec.js can run against: the default build exits at
      # startup rather than pretend it has an engine.
      - name: Build (frontend + binary, -tags dmtap)
        run: npm run build:dmtap

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # Both binaries were just built by the steps above.
          FLOWSTOCK_SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
