name: Release

# On tag vX.Y.Z:
#   - version-guard: tag must equal both VERSION and package.json's "version"
#     (the two places a release number is declared) before anything builds.
#   - frontend: `vite build` once, shared as an artifact — the Go build steps
#     below are pure cross-compilation and shouldn't each pay for npm/vite.
#   - build: the single embedded-frontend binary (`-tags embed_frontend`, see
#     backend/cmd/flowstock/frontend_embed.go), cross-compiled for
#     linux/amd64, linux/arm64, darwin/amd64, darwin/arm64. CGO_ENABLED=0 —
#     the sqlite driver is modernc.org/sqlite (pure Go) and the DMTAP sync
#     bindings are a vendored WASM module (third_party/dmtapsync), so no C
#     toolchain is needed to cross-compile.
#   - release: one GitHub Release with all four archives + SHA256SUMS.txt.
#
# The container image for the same tag is a separate concern — see
# Dockerfile; this workflow does not build or push it.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version-guard:
    name: tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag == VERSION == package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag VERSION=$ver package.json=$pkg"
          if [ "$tag" != "$ver" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::Version mismatch — bump VERSION and package.json to match the tag before pushing it"
            exit 1
          fi

  test:
    name: go test
    needs: version-guard
    runs-on: ubuntu-latest
    # A release is the moment the vendored engine's provenance matters most, so
    # the upstream comparison is mandatory here too — same flag, same checkout
    # as .github/workflows/ci.yml. Skipping it would mean shipping a .wasm blob
    # nothing had tied back to the commit VENDOR.md claims it came from.
    env:
      FLOWSTOCK_REQUIRE_UPSTREAM_VENDOR_CHECK: "1"
      FLOWSTOCK_ENVOIR_DIR: ${{ github.workspace }}/.upstream-envoir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Read the pinned upstream commit
        id: pin
        run: |
          sha="$(grep -m1 '^| Commit' third_party/dmtapsync/VENDOR.md | grep -oE '[0-9a-f]{40}' | head -1)"
          if [ -z "$sha" ]; then
            echo "::error::third_party/dmtapsync/VENDOR.md has no 40-character commit in its 'Commit' row"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pinned upstream commit: $sha"
      - name: Check out envoir at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: vul-os/envoir
          ref: ${{ steps.pin.outputs.sha }}
          path: .upstream-envoir
      - run: go test ./backend/...
      # The substrate package only compiles under its own tag; without this the
      # release would ship having never built it.
      - run: go test -tags dmtap ./backend/...

  frontend:
    name: build frontend
    needs: version-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [test, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/cmd/flowstock/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="flowstock_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          go build -tags embed_frontend -trimpath \
            -ldflags "-s -w -X main.Version=${version}" \
            -o "dist/${name}/flowstock" ./backend/cmd/flowstock
          # The repo is dual-licensed and carries no plain LICENSE file; naming
          # one here made `cp` fail, which failed this job, which is why no
          # release archive has ever been produced.
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE \
             flowstock.config.example.json "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish GitHub release (checksummed + attested)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the Release and upload assets
      id-token: write       # mint the OIDC token the attestation is signed with
      attestations: write   # record the attestation against this repo
    steps:
      # scripts/verify.sh checks this job's own output below, so the repo has to
      # be present.
      - uses: actions/checkout@v4

      # Everything that will be published lands in dist/ and nothing else does.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # install.sh and scripts/verify.sh both refuse to install or verify
      # anything this file does not cover, so the manifest is generated FROM the
      # staged directory rather than from a hand-written glob: "published" and
      # "covered" become the same set by construction instead of two lists
      # someone keeps in sync.
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail

          mapfile -t ASSETS < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec basename {} \; | LC_ALL=C sort)

          # FAIL CLOSED. `sha256sum -- *.tar.gz` was the whole step: if the
          # build matrix produced nothing the glob would go through literally
          # and this could still publish a release whose manifest vouched for
          # nothing. A build that produced no artifacts is a red release.
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::dist/ contains no artifacts — refusing to publish a release whose manifest would vouch for nothing."
            exit 1
          fi

          : > SHA256SUMS.txt
          for a in "${ASSETS[@]}"; do
            sha256sum "$a" >> SHA256SUMS.txt
          done

          # COVERAGE ASSERTION. Without this the step is trivially satisfiable:
          # a one-line manifest "covers" a four-archive release and every later
          # check still passes.
          LINES="$(wc -l < SHA256SUMS.txt | tr -d ' ')"
          if [ "$LINES" -ne "${#ASSETS[@]}" ]; then
            echo "::error::SHA256SUMS.txt has ${LINES} line(s) for ${#ASSETS[@]} staged artifact(s) — the manifest does not cover the release."
            exit 1
          fi

          echo "SHA256SUMS.txt covers ${#ASSETS[@]} artifact(s):"
          cat SHA256SUMS.txt
          printf '%s\n' "${ASSETS[@]}" > "${RUNNER_TEMP}/release-assets.txt"

      # The producer checked by the consumer. If verify.sh and the emit step
      # ever disagree about the format, this surfaces in a red release job
      # rather than in a user's terminal after the release is public.
      - name: Verify SHA256SUMS.txt with the same script users run
        run: |
          set -euo pipefail
          mapfile -t ASSETS < "${RUNNER_TEMP}/release-assets.txt"
          bash scripts/verify.sh --dir dist "${ASSETS[@]}"

      # Prove the refusals still fire, on this runner, for this release, before
      # anything is published. A verifier whose failure paths are never
      # exercised is a verifier that has probably stopped failing.
      - name: Prove the verifier still refuses broken releases
        run: bash scripts/verify.sh --selftest

      - name: Prove install.sh still refuses unverified bytes
        run: bash scripts/install-failure-matrix.sh

      # Short-lived sigstore cert minted from this job's OIDC identity. No
      # secret is referenced and none needs to exist — there is no key to store,
      # own or rotate. Attests every file in dist/, including SHA256SUMS.txt
      # itself, so an attestation on the manifest transitively covers every
      # archive the manifest names.
      - name: Attest build provenance (sigstore via OIDC — no long-lived key)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Single self-contained `flowstock` binary (frontend embedded) for each platform, plus `SHA256SUMS.txt` covering every archive attached here.

            ### Verify before you run this

            ```sh
            curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/verify.sh
            bash verify.sh --tag ${{ github.ref_name }} --attest flowstock_${{ github.ref_name }}_linux_amd64.tar.gz
            ```

            `verify.sh` fetches `SHA256SUMS.txt`, looks up the exact entry for
            the asset and compares digests. It exits non-zero, with a distinct
            diagnostic, on a missing or malformed manifest, a missing entry, a
            truncated download or a digest mismatch. There is no skip path.
            `--attest` additionally checks the sigstore build provenance (needs
            the `gh` CLI); without it, provenance is NOT checked and the script
            says so rather than letting a pass imply more than it checked.

            `install.sh` performs the same digest check itself and will not
            install an archive it could not verify.

            Container image: build `Dockerfile` yourself with `--build-arg VERSION=${{ github.ref_name }}`, or watch for a published `ghcr.io` tag if this repo wires that up separately.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
